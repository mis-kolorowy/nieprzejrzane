<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Nieprzejrzane z jedną sekcją</title>
	<style>
		:root {
			--bg-color: #f8f9fa;
			--text-color: #202122;
			--panel-bg: #ffffff;
			--border-color: #a2a9b1;
			--title-color: #54595d;
			--grid-bg: #fafafa;
			--grid-border: #eaecf0;
			--table-bg: #ffffff;
			--th-bg: #eaecf0;
			--tr-even: #f8f9fa;
			--tr-hover: #eaf3ff;
			--link-color: #36c;
			--btn-bg: #ffffff;
			--btn-text: #202122;
			--preview-bg: #ffffff;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			margin: 15px;
			background-color: var(--bg-color);
			color: var(--text-color);
		}

		.header-container {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 15px;
		}

		h1 { font-size: 20px; margin: 0; }

		.filter-panel {
			background: var(--panel-bg);
			border: 1px solid var(--border-color);
			border-radius: 4px;
			padding: 15px;
			margin-bottom: 15px;
			display: flex;
			flex-direction: column;
			gap: 16px;
		}

		.filter-group { display: flex; flex-direction: column; gap: 6px; }
		.filter-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}
		.filter-group label.group-title { font-size: 11px; font-weight: bold; color: var(--title-color); text-transform: uppercase; }

		.radio-group-inline { display: flex; gap: 12px; flex-wrap: wrap; }
		.radio-label, .checkbox-label { font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }

		.selection-grid {
			display: flex;
			flex-direction: column;
			flex-wrap: wrap;
			max-height: 180px;
			overflow-x: auto;
			overflow-y: hidden;
			gap: 6px 16px;
			border: 1px solid var(--grid-border);
			padding: 8px;
			border-radius: 3px;
			background: var(--grid-bg);
		}

		.selection-grid .checkbox-label {
			width: 170px;
			white-space: nowrap;
		}

		.counter { margin-bottom: 10px; font-size: 14px; font-weight: bold; }
		.pagination { margin: 15px 0; display: flex; gap: 10px; align-items: center; }

		button {
			padding: 6px 12px;
			border: 1px solid var(--border-color);
			background: var(--btn-bg);
			color: var(--btn-text);
			border-radius: 3px;
			cursor: pointer;
		}
		button.btn-small {
			padding: 2px 6px;
			font-size: 11px;
		}
		button:disabled { opacity: 0.5; cursor: not-allowed; }

		.table-wrapper { overflow-x: auto; }
		table.main-table { width: 100%; border-collapse: collapse; background: var(--table-bg); border: 1px solid var(--border-color); min-width: 900px; }
		th, td { border: 1px solid var(--border-color); padding: 8px 10px; text-align: left; font-size: 13px; }
		th {
			background-color: var(--th-bg);
			font-weight: bold;
			cursor: pointer;
			user-select: none;
			position: relative;
			padding-right: 20px;
		}
		th:hover { opacity: 0.85; }
		th::after {
			content: '';
			position: absolute;
			right: 6px;
			top: 50%;
			transform: translateY(-50%);
			font-size: 10px;
			opacity: 0.5;
		}
		th.sort-asc::after { content: '▲'; opacity: 1; }
		th.sort-desc::after { content: '▼'; opacity: 1; }

		tr.main-row:nth-child(4n+1) { background-color: var(--table-bg); }
		tr.main-row:nth-child(4n+3) { background-color: var(--tr-even); }
		tr.main-row:hover { background-color: var(--tr-hover); }

		.main-table td:first-child { font-size: 15px; font-weight: bold; }

		a { color: var(--link-color); text-decoration: none; }
		a:hover { text-decoration: underline; }
		#loading { font-size: 16px; color: var(--link-color); font-weight: bold; margin: 20px 0; }

		/* --- STYLE DLA WIKI-KODU --- */
		.preview-row { display: none; }
		.preview-row.open { display: table-row; }

		.code-container {
			padding: 12px;
			background: var(--preview-bg);
		}

		.code-view {
			font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
			font-size: 12px;
			white-space: pre-wrap;
			word-break: break-all;
			line-height: 1.4;
			color: #24292e;
			background: var(--grid-bg);
			border: 1px solid var(--border-color);
			border-radius: 4px;
			padding: 12px;
			height: auto;
		}
	</style>
</head>
<body>

	<div class="header-container">
		<h1>Nieprzejrzane z jedną sekcją językową w polskim Wikisłowniku (stan na dzień 18 sierpnia 2026)</h1>
	</div>

	<div class="filter-panel">
		<div class="filter-group">
			<div class="radio-group-inline">
				<label class="checkbox-label">
					<input type="checkbox" id="showPreviewFilter">
					<strong>Pokaż wiki-kod</strong>
				</label>
			</div>
		</div>

		<div class="filter-group">
			<div class="filter-header">
				<label class="group-title">Wybierz język</label>
				<button class="btn-small" onclick="toggleSelectAll('languagesContainer')">Zaznacz/Odznacz wszystko</button>
			</div>
			<div class="radio-group-inline" style="margin-bottom: 6px;">
				<label class="radio-label"><input type="radio" name="langMode" value="include" checked> Tylko wybrane języki</label>
				<label class="radio-label"><input type="radio" name="langMode" value="exclude"> Bez wybranych języków</label>
			</div>
			<div class="selection-grid" id="languagesContainer"></div>
		</div>

		<div class="filter-group">
			<div class="filter-header">
				<label class="group-title">Wybierz autora</label>
				<button class="btn-small" onclick="toggleSelectAll('creatorsContainer')">Zaznacz/Odznacz wszystko</button>
			</div>
			<div class="radio-group-inline" style="margin-bottom: 6px;">
				<label class="radio-label"><input type="radio" name="creatorMode" value="include" checked> Tylko wybrani autorzy</label>
				<label class="radio-label"><input type="radio" name="creatorMode" value="exclude"> Bez wybranych autorów</label>
			</div>
			<div class="selection-grid" id="creatorsContainer"></div>
		</div>

		<div class="filter-group">
			<div class="filter-header">
				<label class="group-title">Wybierz współautora</label>
				<button class="btn-small" onclick="toggleSelectAll('contributorsContainer')">Zaznacz/Odznacz wszystko</button>
			</div>
			<div class="radio-group-inline" style="margin-bottom: 6px;">
				<label class="radio-label"><input type="radio" name="contribMode" value="include" checked> Tylko wybrani współautorzy</label>
				<label class="radio-label"><input type="radio" name="contribMode" value="exclude"> Bez wybranych współautorów</label>
			</div>
			<div class="selection-grid" id="contributorsContainer"></div>
		</div>
	</div>

	<div id="loading">Wczytywanie bazy danych...</div>

	<div class="counter">
		Znaleziono: <span id="visibleCount">0</span> / <span id="totalCount">0</span>
	</div>

	<div class="table-wrapper">
		<table class="main-table">
			<thead>
				<tr>
					<th data-sort="title">Hasło</th>
					<th data-sort="language">Język</th>
					<th data-sort="created_at">Data utworzenia</th>
					<th data-sort="size_bytes">Rozmiar strony (bajty)</th>
					<th data-sort="creator">Autor</th>
					<th data-sort="contributors">Współautorzy</th>
					<th data-sort="backlinks_count">Liczba linkujących</th>
				</tr>
			</thead>
			<tbody id="tableBody"></tbody>
		</table>
	</div>

	<div class="pagination">
		<button id="prevBtn">← Poprzednia</button>
		<span>Strona <span id="currentPage">1</span> z <span id="totalPages">1</span></span>
		<button id="nextBtn">Następna →</button>
	</div>

	<script>
		let rawData = [];
		let filteredData = [];
		let currentPage = 1;
		const PAGE_SIZE = 50;

		let sortColumn = null;
		let sortDirection = 'asc';

		const IP_OR_TEMP_KEY = '__IP_AND_TEMP__';

		function isIpOrTempAccount(username) {
			if (!username) return false;
			if (username.startsWith('~')) return true;
			const ipv4Pattern = /^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$/;
			const ipv6Pattern = /^(?:[0-9a-fA-F]{1,4}:){1,7}[0-9a-fA-F]{1,4}$/;
			return ipv4Pattern.test(username) || ipv6Pattern.test(username);
		}

		async function init() {
			try {
				const res = await fetch('dane.json');
				rawData = await res.json();
				
				document.getElementById('loading').style.display = 'none';
				document.getElementById('totalCount').textContent = rawData.length;

				populateLanguages();
				populateCreators();
				populateContributors();
				attachEventListeners();
				applyFilters();
			} catch (e) {
				document.getElementById('loading').textContent = 'Błąd wczytywania danych JSON!';
			}
		}

		function populateLanguages() {
			const container = document.getElementById('languagesContainer');
			const langCounts = {};

			rawData.forEach(item => {
				if (item.language) {
					langCounts[item.language] = (langCounts[item.language] || 0) + 1;
				}
			});

			const sortedLangs = Object.keys(langCounts).sort((a, b) => a.localeCompare(b, 'pl'));

			let html = '';
			sortedLangs.forEach(lang => {
				const count = langCounts[lang];
				html += `
					<label class="checkbox-label">
						<input type="checkbox" name="langCheck" value="${escapeHtml(lang.toLowerCase())}">
						${escapeHtml(lang)} (${count})
					</label>
				`;
			});

			container.innerHTML = html;
		}

		function populateCreators() {
			const container = document.getElementById('creatorsContainer');
			const creatorCounts = {};
			let ipOrTempCount = 0;

			rawData.forEach(item => {
				if (item.creator) {
					if (isIpOrTempAccount(item.creator)) {
						ipOrTempCount++;
					} else {
						creatorCounts[item.creator] = (creatorCounts[item.creator] || 0) + 1;
					}
				}
			});

			const sortedCreators = Object.keys(creatorCounts).sort((a,b) => a.localeCompare(b, 'pl'));

			let html = '';
			if (ipOrTempCount > 0) {
				html += `
					<label class="checkbox-label" style="font-weight: bold;">
						<input type="checkbox" name="creatorCheck" value="${IP_OR_TEMP_KEY}">
						IP i konta tymczasowe (${ipOrTempCount})
					</label>
				`;
			}

			sortedCreators.forEach(creator => {
				const count = creatorCounts[creator];
				html += `
					<label class="checkbox-label">
						<input type="checkbox" name="creatorCheck" value="${escapeHtml(creator.toLowerCase())}">
						${escapeHtml(creator)} (${count})
					</label>
				`;
			});

			container.innerHTML = html;
		}

		function populateContributors() {
			const container = document.getElementById('contributorsContainer');
			const namedSet = new Set();
			let hasIpOrTemp = false;

			rawData.forEach(item => {
				if (Array.isArray(item.contributors)) {
					item.contributors.forEach(c => {
						if (isIpOrTempAccount(c)) {
							hasIpOrTemp = true;
						} else {
							namedSet.add(c);
						}
					});
				}
			});

			const sorted = Array.from(namedSet).sort((a,b) => a.localeCompare(b, 'pl'));

			let html = '';
			if (hasIpOrTemp) {
				html += `
					<label class="checkbox-label" style="font-weight: bold;">
						<input type="checkbox" name="contribCheck" value="${IP_OR_TEMP_KEY}">
						IP i konta tymczasowe
					</label>
				`;
			}

			sorted.forEach(contrib => {
				html += `
					<label class="checkbox-label">
						<input type="checkbox" name="contribCheck" value="${escapeHtml(contrib.toLowerCase())}">
						${escapeHtml(contrib)}
					</label>
				`;
			});

			container.innerHTML = html;
		}

		function toggleSelectAll(containerId) {
			const container = document.getElementById(containerId);
			const checkboxes = container.querySelectorAll('input[type="checkbox"]');
			if (checkboxes.length === 0) return;

			const shouldCheckAll = Array.from(checkboxes).some(cb => !cb.checked);
			checkboxes.forEach(cb => cb.checked = shouldCheckAll);
			applyFilters();
		}

		function attachEventListeners() {
			document.querySelector('.filter-panel').addEventListener('change', (e) => {
				if (e.target.matches('input[type="radio"], input[type="checkbox"]')) {
					if (e.target.id === 'showPreviewFilter') {
						renderTable();
					} else {
						applyFilters();
					}
				}
			});

			document.querySelectorAll('th[data-sort]').forEach(th => {
				th.addEventListener('click', () => {
					const col = th.getAttribute('data-sort');
					if (sortColumn === col) {
						sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
					} else {
						sortColumn = col;
						sortDirection = 'asc';
					}
					
					document.querySelectorAll('th[data-sort]').forEach(h => {
						h.classList.remove('sort-asc', 'sort-desc');
					});
					th.classList.add(sortDirection === 'asc' ? 'sort-asc' : 'sort-desc');

					sortData();
					renderTable();
				});
			});
		}

		function applyFilters() {
			const selectedLangs = Array.from(document.querySelectorAll('input[name="langCheck"]:checked')).map(cb => cb.value);
			const langMode = document.querySelector('input[name="langMode"]:checked').value;

			const selectedCreators = Array.from(document.querySelectorAll('input[name="creatorCheck"]:checked')).map(cb => cb.value);
			const creatorMode = document.querySelector('input[name="creatorMode"]:checked').value;

			const selectedContribs = Array.from(document.querySelectorAll('input[name="contribCheck"]:checked')).map(cb => cb.value);
			const contribMode = document.querySelector('input[name="contribMode"]:checked').value;

			filteredData = rawData.filter(item => {
				if (selectedLangs.length > 0) {
					const itemLang = (item.language || '').toLowerCase();
					const isIncluded = selectedLangs.includes(itemLang);
					if (langMode === 'include' && !isIncluded) return false;
					if (langMode === 'exclude' && isIncluded) return false;
				}

				if (selectedCreators.length > 0) {
					const itemCreator = (item.creator || '').toLowerCase();
					const isIpTemp = isIpOrTempAccount(item.creator);
					
					let isMatched = false;
					if (selectedCreators.includes(IP_OR_TEMP_KEY) && isIpTemp) {
						isMatched = true;
					} else if (selectedCreators.includes(itemCreator)) {
						isMatched = true;
					}

					if (creatorMode === 'include' && !isMatched) return false;
					if (creatorMode === 'exclude' && isMatched) return false;
				}

				if (selectedContribs.length > 0) {
					const contribsList = Array.isArray(item.contributors) ? item.contributors : [];
					const contribsLower = contribsList.map(c => c.toLowerCase());

					const hasIpTemp = contribsList.some(c => isIpOrTempAccount(c));
					
					let hasMatch = false;
					if (selectedContribs.includes(IP_OR_TEMP_KEY) && hasIpTemp) {
						hasMatch = true;
					}
					if (!hasMatch) {
						hasMatch = selectedContribs.some(sc => contribsLower.includes(sc));
					}

					if (contribMode === 'include' && !hasMatch) return false;
					if (contribMode === 'exclude' && hasMatch) return false;
				}

				return true;
			});

			currentPage = 1;
			if (sortColumn) {
				sortData();
			}
			renderTable();
		}

		function sortData() {
			if (!sortColumn) return;

			filteredData.sort((a, b) => {
				let valA = a[sortColumn];
				let valB = b[sortColumn];

				if (sortColumn === 'contributors') {
					valA = Array.isArray(a.contributors) ? a.contributors.join(', ') : '';
					valB = Array.isArray(b.contributors) ? b.contributors.join(', ') : '';
				}

				let comparison = 0;
				if (typeof valA === 'number' && typeof valB === 'number') {
					comparison = valA - valB;
				} else if (typeof valA === 'string' && typeof valB === 'string') {
					comparison = valA.localeCompare(valB, 'pl');
				} else {
					comparison = String(valA || '').localeCompare(String(valB || ''), 'pl');
				}

				return sortDirection === 'asc' ? comparison : -comparison;
			});
		}

		function formatDate(isoString) {
			if (!isoString) return '';
			return isoString.replace('T', ' ').replace('Z', '');
		}

		function renderTable() {
			const tbody = document.getElementById('tableBody');
			tbody.innerHTML = '';

			const showPreview = document.getElementById('showPreviewFilter').checked;

			const totalPages = Math.ceil(filteredData.length / PAGE_SIZE) || 1;
			const start = (currentPage - 1) * PAGE_SIZE;
			const pageItems = filteredData.slice(start, start + PAGE_SIZE);

			pageItems.forEach((item) => {
				const tr = document.createElement('tr');
				tr.className = 'main-row';
				
				const titleEnc = encodeURIComponent(item.title);
				const contribsArr = Array.isArray(item.contributors) ? item.contributors : [];
				const contribsStr = contribsArr.join(', ');

				tr.innerHTML = `
					<td><a href="https://pl.wiktionary.org/wiki/${titleEnc}" target="_blank">${escapeHtml(item.title)}</a></td>
					<td>${escapeHtml(item.language || '')}</td>
					<td>${formatDate(item.created_at)}</td>
					<td>${item.size_bytes !== undefined ? item.size_bytes : ''}</td>
					<td>${escapeHtml(item.creator || '')}</td>
					<td>${escapeHtml(contribsStr)}</td>
					<td>${item.backlinks_count !== undefined ? item.backlinks_count : 0}</td>
				`;
				tbody.appendChild(tr);
				
				if (item.wikitext !== undefined) {
					const previewTr = document.createElement('tr');
					previewTr.className = `preview-row ${showPreview ? 'open' : ''}`;

					previewTr.innerHTML = `
						<td colspan="7">
							<div class="code-container">
								<div class="code-view"><code>${escapeHtml(item.wikitext)}</code></div>
							</div>
						</td>
					`;
					tbody.appendChild(previewTr);
				}
			});

			document.getElementById('visibleCount').textContent = filteredData.length;
			document.getElementById('currentPage').textContent = currentPage;
			document.getElementById('totalPages').textContent = totalPages;
			document.getElementById('prevBtn').disabled = currentPage === 1;
			document.getElementById('nextBtn').disabled = currentPage >= totalPages;
		}

		function escapeHtml(str) {
			if (!str) return '';
			return String(str)
				.replace(/&/g, "&amp;")
				.replace(/</g, "&lt;")
				.replace(/>/g, "&gt;")
				.replace(/"/g, "&quot;")
				.replace(/'/g, "&#039;");
		}

		document.getElementById('prevBtn').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderTable(); } });
		document.getElementById('nextBtn').addEventListener('click', () => { if (currentPage * PAGE_SIZE < filteredData.length) { currentPage++; renderTable(); } });

		init();
	</script>
</body>
</html>
